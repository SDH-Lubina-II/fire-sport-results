<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDH Lubina II–Větřkovice</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:white;
  background:
    radial-gradient(circle at top right,#5b1010 0%,transparent 35%),
    linear-gradient(145deg,#090d13,#151b24);
}

.app{
  max-width:850px;
  margin:auto;
  padding:20px 16px 40px;
}

button{
  font-family:inherit;
}

.header{
  text-align:center;
  padding:20px 5px 25px;
}

.logo{
  font-size:42px;
  margin-bottom:12px;
}

.header h1{
  font-size:22px;
  line-height:1.35;
  margin:0;
}

.header h1 span{
  color:#ef3333;
}

.district{
  color:#8995a6;
  margin-top:7px;
  font-size:14px;
}

.card{
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.10);
  border-radius:22px;
  padding:20px;
  margin-bottom:16px;
}

h2{
  margin:0 0 18px;
  font-size:24px;
}

.form{
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:10px;
}

input{
  width:100%;
  padding:13px;
  border-radius:12px;
  border:1px solid #354052;
  background:#101722;
  color:white;
  font-size:15px;
}

input::placeholder{
  color:#738095;
}

.primary{
  border:0;
  border-radius:12px;
  padding:13px 18px;
  background:#d72f2f;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.primary:hover{
  background:#ed3a3a;
}

.back{
  border:1px solid #394455;
  background:transparent;
  color:#aeb9c8;
  padding:10px 15px;
  border-radius:11px;
  cursor:pointer;
  margin-bottom:15px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  text-align:center;
  padding:12px 8px;
  background:#b92828;
  font-size:13px;
}

td{
  padding:12px 8px;
  border-bottom:1px solid rgba(255,255,255,.08);
  text-align:center;
  color:#dbe2eb;
}

tr:first-child td{
  font-weight:bold;
}

.time{
  font-size:19px;
  font-weight:bold;
}

.best{
  color:#ffd166;
}

.action{
  border:0;
  background:transparent;
  color:#aeb9c8;
  cursor:pointer;
  font-size:18px;
  margin:0 3px;
}

.empty{
  text-align:center;
  padding:30px 10px;
  color:#718096;
}

.hidden{
  display:none;
}

.infinity{
  color:#ff6969;
  font-size:21px;
  font-weight:bold;
}

.status{
  text-align:center;
  color:#68778b;
  font-size:12px;
  margin-top:20px;
}

.online{
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#36d399;
  margin-right:6px;
  box-shadow:0 0 9px #36d399;
}

@media(max-width:650px){
  .form{
    grid-template-columns:1fr 1fr;
  }

  .form .primary{
    grid-column:1 / -1;
  }

  table{
    font-size:13px;
  }

  th,td{
    padding:10px 4px;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- HLAVNI STRANKA -->

<div id="home">

  <header class="header">
    <div class="logo">🚒</div>

    <h1>
      <span>SBOR DOBROVOLNÝCH HASIČŮ</span><br>
      LUBINA II–VĚTŘKOVICE
    </h1>

    <div class="district">
      okres Nový Jičín
    </div>
  </header>

  <div class="card" onclick="otevriMotani()" style="cursor:pointer">
    <div style="font-size:45px;margin-bottom:10px">🌀</div>
    <h2>Motání hadic</h2>
    <div style="color:#9eabba">
      Jednotlivci · nejrychlejší čas
    </div>
  </div>

  <div class="card" onclick="otevriPozarni()" style="cursor:pointer">
    <div style="font-size:45px;margin-bottom:10px">🚒</div>
    <h2>Požární útok</h2>
    <div style="color:#9eabba">
      Aktuální pořadí
    </div>
  </div>

</div>


<!-- MOTANI HADIC -->

<div id="motani" class="hidden">

  <button class="back" onclick="zpet()">
    ← Zpět
  </button>

  <div class="card">

    <h2>🌀 Motání hadic</h2>

    <div class="form">

      <input
        id="prijmeni"
        placeholder="Příjmení">

      <input
        id="jmeno"
        placeholder="Jméno">

      <button
        class="primary"
        onclick="pridatZavodnika()">
        + Přidat
      </button>

    </div>

  </div>


  <div class="card">

    <h2>Aktuální pořadí</h2>

    <table>

      <thead>
        <tr>
          <th>#</th>
          <th>Příjmení</th>
          <th>Jméno</th>
          <th>Čas</th>
          <th>Akce</th>
        </tr>
      </thead>

      <tbody id="tabulka"></tbody>

    </table>

  </div>

  <div class="status">
    <span class="online"></span>
    Živá aktualizace
  </div>

</div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  deleteDoc,
  updateDoc,
  doc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* ================= FIREBASE ================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyCIZ3Z5HvF6P9TSQ9GxiZEIoVGFsay2pbo",

  authDomain:
  "fire-sport-results.firebaseapp.com",

  projectId:
  "fire-sport-results",

  storageBucket:
  "fire-sport-results.firebasestorage.app",

  messagingSenderId:
  "63170955961",

  appId:
  "1:63170955961:web:f5b9e052312a79b17de968"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const motaniCollection =
  collection(db,"motani_hadic");


let zavodnici = [];


/* ================= NAVIGACE ================= */

window.otevriMotani = function(){

  document.getElementById("home")
  .classList.add("hidden");

  document.getElementById("motani")
  .classList.remove("hidden");

};


window.otevriPozarni = function(){

  alert("Požární útok připravujeme.");

};


window.zpet = function(){

  document.getElementById("motani")
  .classList.add("hidden");

  document.getElementById("home")
  .classList.remove("hidden");

};


/* ================= FIREBASE REALTIME ================= */

onSnapshot(motaniCollection,(snapshot)=>{

  zavodnici = [];

  snapshot.forEach((item)=>{

    zavodnici.push({
      id:item.id,
      ...item.data()
    });

  });

  vykresli();

});


/* ================= PRIDANI ================= */

window.pridatZavodnika = async function(){

  const prijmeni =
    document.getElementById("prijmeni")
    .value.trim();

  const jmeno =
    document.getElementById("jmeno")
    .value.trim();

  if(!prijmeni || !jmeno){

    alert("Vyplň příjmení i jméno.");

    return;
  }

  await addDoc(motaniCollection,{

    prijmeni:prijmeni,

    jmeno:jmeno,

    cas:null,

    nedokoncil:false,

    vytvoreno:serverTimestamp()

  });

  document.getElementById("prijmeni").value="";
  document.getElementById("jmeno").value="";

};


/* ================= CAS ================= */

function casNaSekundy(cas){

  const casti=cas.split(":");

  return Number(casti[0])*60+
         Number(casti[1]);

}


function platnyCas(cas){

  if(!/^\d+:\d{2}$/.test(cas))
    return false;

  const casti=cas.split(":");

  const sekundy=Number(casti[0]);

  const setiny=Number(casti[1]);

  return sekundy>=0 &&
         setiny>=0 &&
         setiny<=99;

}


/* ================= ZAPSAT CAS ================= */

window.zapsatCas = async function(id){

  const zadany =
    prompt("Zadej čas například 15:23");

  if(!zadany)
    return;

  if(!platnyCas(zadany)){

    alert("Špatný formát. Použij například 15:23.");

    return;
  }

  await updateDoc(
    doc(db,"motani_hadic",id),
    {
      cas:zadany,
      nedokoncil:false
    }
  );

};


/* ================= NEDOKONCIL ================= */

window.nedokoncil = async function(id){

  await updateDoc(

    doc(db,"motani_hadic",id),

    {
      cas:null,
      nedokoncil:true
    }

  );

};


/* ================= EDIT ================= */

window.upravit = async function(id){

  const z =
    zavodnici.find(x=>x.id===id);

  if(!z)
    return;

  const novePrijmeni =
    prompt("Příjmení:",z.prijmeni);

  if(!novePrijmeni)
    return;

  const noveJmeno =
    prompt("Jméno:",z.jmeno);

  if(!noveJmeno)
    return;

  await updateDoc(

    doc(db,"motani_hadic",id),

    {
      prijmeni:novePrijmeni,
      jmeno:noveJmeno
    }

  );

};


/* ================= SMAZAT ================= */

window.smazat = async function(id){

  if(!confirm("Opravdu smazat závodníka?"))
    return;

  await deleteDoc(
    doc(db,"motani_hadic",id)
  );

};


/* ================= VYKRESLENI ================= */

function vykresli(){

  const tabulka =
    document.getElementById("tabulka");

  let serazeni =
    [...zavodnici];

  serazeni.sort((a,b)=>{

    if(a.nedokoncil && !b.nedokoncil)
      return 1;

    if(!a.nedokoncil && b.nedokoncil)
      return -1;

    if(a.nedokoncil && b.nedokoncil)
      return 0;

    if(a.cas===null)
      return 1;

    if(b.cas===null)
      return -1;

    return casNaSekundy(a.cas) -
           casNaSekundy(b.cas);

  });


  if(serazeni.length===0){

    tabulka.innerHTML=`
      <tr>
        <td colspan="5" class="empty">
          Zatím není přidaný žádný závodník.
        </td>
      </tr>
    `;

    return;
  }


  tabulka.innerHTML="";


  serazeni.forEach((z,index)=>{

    let casText="-";
    let casClass="";

    if(z.nedokoncil){

      casText="∞";
      casClass="infinity";

    }else if(z.cas){

      casText=z.cas;
      casClass="time";

    }


    tabulka.innerHTML+=`

      <tr>

        <td>${index+1}</td>

        <td>${z.prijmeni}</td>

        <td>${z.jmeno}</td>

        <td class="${casClass}">
          ${casText}
        </td>

        <td>

          <button
            class="action"
            onclick="zapsatCas('${z.id}')">
            ⏱
          </button>

          <button
            class="action"
            onclick="nedokoncil('${z.id}')">
            ∞
          </button>

          <button
            class="action"
            onclick="upravit('${z.id}')">
            ✏️
          </button>

          <button
            class="action"
            onclick="smazat('${z.id}')">
            🗑️
          </button>

        </td>

      </tr>

    `;

  });

}

</script>

</body>
</html>
